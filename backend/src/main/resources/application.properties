spring.application.name=ysgs-backend

# 完全乾淨的變數對應
spring.datasource.url=${RENDER_DB_URL}
spring.datasource.username=${RENDER_DB_USER}
spring.datasource.password=${RENDER_DB_PASSWORD}

# 雲端 Supabase 連線憑證修正
spring.datasource.properties.sslfactory=org.postgresql.ssl.NonValidatingFactory

# HikariCP 與 JPA 基本設定
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway 設定
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 伺服器與監聽連接埠設定
server.port=8080
server.error.include-message=always

# 商業邏輯變數
app.tenant-id=${TENANT_ID:2}
app.jwt.secret='${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}'
app.jwt.expiration-ms=86400000

# Supabase Storage 變數
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

# 調低日誌層級，避免快取日誌干擾
://level.com.ysgs=DEBUG
://level.com.zaxxer.hikari=DEBUG
