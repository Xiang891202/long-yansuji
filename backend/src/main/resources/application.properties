spring.application.name=ysgs-backend

# 資料庫連線設定（使用環境變數，提供預設值避免解析錯誤）
# spring.datasource.url=${RENDER_DB_URL:jdbc:postgresql://db.bsgmgwwogsrtageajzks.supabase.co:5432/postgres?sslmode=require}
# spring.datasource.username=${RENDER_DB_USER:postgres}
# spring.datasource.password=${RENDER_DB_PASSWORD:}

# 【新增】解決雲端環境連線 Supabase 憑證握手失敗的問題
spring.datasource.properties.sslfactory=org.postgresql.ssl.NonValidatingFactory

# 連線池與 JPA 設定
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway 資料庫遷移設定
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 伺服器與 Port 設定
server.port=8080
server.error.include-message=always

# 專案自訂變數
app.tenant-id=${TENANT_ID:2}
app.jwt.secret='${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}'
app.jwt.expiration-ms=86400000

# Supabase Storage 設定
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

# 日誌層級
logging.level.com.ysgs=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG