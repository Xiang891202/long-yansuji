version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ysgs-backend
    ports:
      - "8080:8080"
    environment:
      - .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: ysgs-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: ysgs-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: